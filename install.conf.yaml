- create:
  - ~/.config/nvim/session
  - ~/.config/tmux
  - ~/.config/opencode
    
- shell:
  - [test -d ~/.tmux/plugins/tpm || git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm, Installing plugin manager for tmux]

- shell:
  - [test -d ~/.tmux/plugins/vim-tmux-navigator || ~/.tmux/plugins/tpm/bin/install_plugins, Running Tmux Plugin installer]

- shell:
  - ["command -v rustup >/dev/null || curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal", Installing Rust toolchain]
  - ["export PATH=\"$HOME/.cargo/bin:$PATH\"; command -v tree-sitter >/dev/null || cargo install tree-sitter-cli --locked", Installing tree-sitter-cli]
  - [uv tool install basedpyright, Installing Python LSP server]

- link:
    ~/.zshrc:
      force: true
      path: zshrc
    
    ~/.config/nvim/init.lua: init.lua

    ~/.config/nvim/lua: nvim/lua

    ~/.config/nvim/ftplugin: nvim/ftplugin

    ~/.config/nvim/zettelkasten.vim: nvim/zettelkasten.vim
      
    ~/.config/tmux/tmux.conf: tmux.conf

    ~/.config/opencode/agents/jig-master.md: opencode/agents/jig-master.md

    ~/.config/opencode/agents/Collaborator.md: opencode/agents/Collaborator.md

    ~/.config/opencode/agents/Junior Developer.md: opencode/agents/Junior Developer.md
